<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred Sitorus</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #c8a96e;
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.55);
      --card-bg: rgba(8, 8, 12, 0.55);
      --card-border: rgba(255,255,255,0.08);
      --shadow: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      --gap: clamp(20px, 4vw, 60px);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: #080808;
      overflow-x: hidden;
    }

    /* ── BACKGROUND ── */
    .bg-fixed {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('background.jpg') center/cover no-repeat;
    }
    .bg-fixed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 8, 0.58);
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 var(--gap);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 6, 10, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
      padding-bottom: 4px;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }

    /* ── PAGE WRAPPER ── */
    .page {
      position: relative;
      z-index: 1;
      padding-top: 64px; /* offset for fixed nav */
    }

    /* ── HERO ── */
    .hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 0 var(--gap);
    }

    .hero-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: clamp(40px, 6vw, 100px);
    }

    /* LEFT — text */
    .hero-text { animation: fadeLeft 0.8s ease both; }

    .hero-label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }

    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 6vw, 5.5rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 16px;
    }
    .hero-name strong {
      font-weight: 700;
      display: block;
    }

    .hero-title {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .hero-bio {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 460px;
      margin-bottom: 40px;
    }

    .hero-cta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 28px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s;
      display: inline-block;
    }
    .btn-primary {
      background: var(--accent);
      color: #080808;
      border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: #dfc08a; border-color: #dfc08a; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* RIGHT — profile photo */
    .hero-photo-wrap {
      flex-shrink: 0;
      animation: fadeRight 0.8s ease 0.15s both;
    }

    .hero-photo {
      width: clamp(260px, 28vw, 400px);
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top center;
      display: block;
      border-radius: 4px;
      box-shadow: var(--shadow), 0 0 0 1px var(--card-border);
      /* frosted card feel behind the image */
      outline: 8px solid rgba(8,8,12,0.35);
      outline-offset: -1px;
    }

    /* placeholder if no photo yet */
    .hero-photo-placeholder {
      width: clamp(260px, 28vw, 400px);
      aspect-ratio: 3/4;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }
    .hero-photo-placeholder svg { opacity: 0.3; }

    /* ── ANIMATIONS ── */
    @keyframes fadeLeft {
      from { opacity: 0; transform: translateX(-28px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeRight {
      from { opacity: 0; transform: translateX(28px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .hero-inner {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        text-align: center;
        gap: 40px;
      }
      .hero-photo-wrap { order: -1; margin: 0 auto; }
      .hero-bio { margin-left: auto; margin-right: auto; }
      .hero-cta { justify-content: center; }
      .nav-links { gap: 20px; }
    }
  </style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-fixed"></div>

<!-- NAVBAR -->
<nav>
  <a href="#home" class="nav-logo">Your<span>Name</span></a>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#education">Education</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#research">Research</a></li>
  </ul>
</nav>

<!-- PAGE -->
<div class="page">

  <!-- HERO -->
  <section id="home" class="hero">
    <div class="hero-inner">

      <!-- LEFT: text -->
      <div class="hero-text">
        <div class="hero-label">Welcome to my portfolio</div>
        <h1 class="hero-name">
          Your
          <strong>Full Name</strong>
        </h1>
        <p class="hero-title">Researcher · Developer · Engineer</p>
        <p class="hero-bio">
          A short line or two about who you are and what you do.
          Keep it punchy — one strong sentence is better than five weak ones.
        </p>
        <div class="hero-cta">
          <a href="#research" class="btn btn-primary">View Research</a>
          <a href="#experience" class="btn btn-ghost">My Experience</a>
        </div>
      </div>

      <!-- RIGHT: photo -->
      <div class="hero-photo-wrap">
        <img
          class="hero-photo"
          src="profile.jpg"
          alt="Profile photo"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        />
        <div class="hero-photo-placeholder" style="display:none;">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          profile.jpg
        </div>
      </div>

    </div>
  </section>

</div>

</body>
</html>
